name = "sunshade-links-edge"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Default / Local development bindings
kv_namespaces = [
  { binding = "LINKS_KV", id = "links_kv_local_id", preview_id = "links_kv_local_preview_id" }
]

[[queues.producers]]
binding = "TELEMETRY_QUEUE"
queue = "links-telemetry-queue-dev"

[[queues.consumers]]
queue = "links-telemetry-queue-dev"
max_batch_size = 100
max_batch_timeout = 10

[ratelimits]
binding = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 10 }

[vars]
DASHBOARD_ORIGIN = "https://sunshade-links-dashboard.pages.dev"

# Staging Environment
[env.staging]
name = "sunshade-links-edge-staging"

routes = [
  { pattern = "staging-links.sunshade.icu/*", zone_name = "sunshade.icu" }
]

kv_namespaces = [
  { binding = "LINKS_KV", id = "links_kv_staging_id", preview_id = "links_kv_staging_preview" }
]

[[env.staging.queues.producers]]
binding = "TELEMETRY_QUEUE"
queue = "links-telemetry-queue-staging"

[[env.staging.queues.consumers]]
queue = "links-telemetry-queue-staging"
max_batch_size = 100
max_batch_timeout = 10

[env.staging.ratelimits]
binding = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 10 }

[env.staging.vars]
DASHBOARD_ORIGIN = "https://staging.sunshade-links-dashboard.pages.dev"

# Production Environment
[env.production]
name = "sunshade-links-edge-production"

routes = [
  { pattern = "links.sunshade.icu/*", zone_name = "sunshade.icu", custom_domain = true }
]

kv_namespaces = [
  { binding = "LINKS_KV", id = "links_kv_prod_id" }
]

[[env.production.queues.producers]]
binding = "TELEMETRY_QUEUE"
queue = "links-telemetry-queue-prod"

[[env.production.queues.consumers]]
queue = "links-telemetry-queue-prod"
max_batch_size = 100
max_batch_timeout = 10

[env.production.ratelimits]
binding = "RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 100, period = 10 }

[env.production.vars]
DASHBOARD_ORIGIN = "https://sunshade-links-dashboard.pages.dev"

